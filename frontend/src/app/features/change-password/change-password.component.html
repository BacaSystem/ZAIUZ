<div class="change-password-container">
  <mat-card class="change-password-card">
    <mat-card-header>
      <div class="header-content">
        <mat-icon class="app-icon">lock</mat-icon>
        <div class="header-text">
          <mat-card-title>Change Password</mat-card-title>
          <mat-card-subtitle>Update your account password</mat-card-subtitle>
        </div>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Current Password</mat-label>
          <input matInput 
                 [type]="hideCurrentPassword ? 'password' : 'text'" 
                 formControlName="currentPassword" 
                 placeholder="Enter your current password">
          <button mat-icon-button matSuffix type="button" 
                  (click)="hideCurrentPassword = !hideCurrentPassword" 
                  [attr.aria-label]="'Hide password'" 
                  [attr.aria-pressed]="hideCurrentPassword">
            <mat-icon>{{ hideCurrentPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ getFieldError('currentPassword') }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput 
                 [type]="hideNewPassword ? 'password' : 'text'" 
                 formControlName="newPassword" 
                 placeholder="Enter your new password">
          <button mat-icon-button matSuffix type="button" 
                  (click)="hideNewPassword = !hideNewPassword" 
                  [attr.aria-label]="'Hide password'" 
                  [attr.aria-pressed]="hideNewPassword">
            <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ getFieldError('newPassword') }}</mat-error>
          <mat-hint>Password must be at least 6 characters long</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm New Password</mat-label>
          <input matInput 
                 [type]="hideConfirmPassword ? 'password' : 'text'" 
                 formControlName="confirmPassword" 
                 placeholder="Confirm your new password">
          <button mat-icon-button matSuffix type="button" 
                  (click)="hideConfirmPassword = !hideConfirmPassword" 
                  [attr.aria-label]="'Hide password'" 
                  [attr.aria-pressed]="hideConfirmPassword">
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ getFieldError('confirmPassword') }}</mat-error>
        </mat-form-field>

      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button 
              type="button" 
              (click)="onCancel()" 
              [disabled]="isLoading()">
        Cancel
      </button>
      <button mat-raised-button 
              color="primary" 
              (click)="onSubmit()"
              class="submit-button"
              [disabled]="!changePasswordForm.valid || isLoading()">
        <mat-icon *ngIf="isLoading()">hourglass_empty</mat-icon>
        <mat-icon *ngIf="!isLoading()">save</mat-icon>
        Change Password
      </button>
    </mat-card-actions>
  </mat-card>
</div>
