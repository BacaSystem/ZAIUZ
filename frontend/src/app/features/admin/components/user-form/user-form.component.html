<mat-card *ngIf="isVisible" class="user-form-card">
  <mat-card-header>
    <mat-card-title>
      <mat-icon>{{ isEditing ? 'edit' : 'add' }}</mat-icon>
      {{ formTitle }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <mat-form-field appearance="outline" class="field-username">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter username">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error>{{ getFieldError('username') }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="field-password">
          <mat-label>{{ isEditing ? 'New Password (optional)' : 'Password' }}</mat-label>
          <input matInput 
                 [type]="hidePassword ? 'password' : 'text'" 
                 formControlName="password" 
                 [placeholder]="isEditing ? 'Leave empty to keep current' : 'Enter password'">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" 
                  [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ getFieldError('password') }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="field-role">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option *ngFor="let role of roleOptions" [value]="role.value">
              {{ role.label }}
            </mat-option>
          </mat-select>
          <mat-icon matSuffix>admin_panel_settings</mat-icon>
          <mat-error>{{ getFieldError('role') }}</mat-error>
        </mat-form-field>
      </div>

      <div class="error-message" *ngIf="errorMessage()">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>

    </form>
  </mat-card-content>

  <mat-card-actions align="end">
    <button 
      mat-button 
      (click)="onCancel()" 
      [disabled]="isLoading()">
      Cancel
    </button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="onSubmit()"
      [disabled]="!userForm.valid || isLoading()">
      <mat-icon *ngIf="isLoading()">hourglass_empty</mat-icon>
      <mat-icon *ngIf="!isLoading()">{{ isEditing ? 'save' : 'add' }}</mat-icon>
      {{ isEditing ? 'Update' : 'Create' }} User
    </button>
  </mat-card-actions>
</mat-card>
